[workspace]
resolver = "3"
members = [
    "crates/stackarr-core",
    "crates/stackarr-media",
    "crates/stackarr-parser",
    "crates/stackarr-quality",
    "crates/stackarr-indexer",
    "crates/stackarr-download",
    "crates/stackarr-import",
    "crates/stackarr-scheduler",
    "crates/stackarr-metadata",
    "crates/stackarr-web",
    "crates/stackarr-notify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AusAgentSmith/StackArr"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unused = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = "0.37"

# TLS
rustls = { version = "0.23", features = ["ring"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Util
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
async-trait = "0.1"
parking_lot = "0.12"
arc-swap = "1"

# API docs
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Internal crates
stackarr-core = { path = "crates/stackarr-core" }
stackarr-media = { path = "crates/stackarr-media" }
stackarr-parser = { path = "crates/stackarr-parser" }
stackarr-quality = { path = "crates/stackarr-quality" }
stackarr-indexer = { path = "crates/stackarr-indexer" }
stackarr-download = { path = "crates/stackarr-download" }
stackarr-import = { path = "crates/stackarr-import" }
stackarr-scheduler = { path = "crates/stackarr-scheduler" }
stackarr-metadata = { path = "crates/stackarr-metadata" }
stackarr-web = { path = "crates/stackarr-web" }
stackarr-notify = { path = "crates/stackarr-notify" }

[package]
name = "stackarr"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ui"]
ui = []
torrent-embedded = ["stackarr-download/torrent-embedded"]
usenet-embedded = ["stackarr-download/usenet-embedded"]

[dependencies]
stackarr-core = { workspace = true }
stackarr-web = { workspace = true }
stackarr-scheduler = { workspace = true }
stackarr-download = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
