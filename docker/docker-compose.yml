services:
  stackarr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${STACKARR_HOST_PORT:-9111}:9111"
    volumes:
      - stackarr-config:/config
      - stackarr-transcode:/config/transcode
      - /media/tv:/media/tv
      - /media/movies:/media/movies
      - /downloads:/downloads
    devices:
      - /dev/dri:/dev/dri  # Intel QSV / VAAPI hardware transcoding
    environment:
      - STACKARR_DATABASE_URL=mysql://${MARIADB_USER:-stackarr}:${MARIADB_PASSWORD:-stackarr}@mariadb:3306/${MARIADB_DATABASE:-stackarr}
      - STACKARR_LOG_LEVEL=info
      - STACKARR_BIND=0.0.0.0
      - STACKARR_PORT=9111
      - STACKARR_TMDB_API_KEY=${STACKARR_TMDB_API_KEY:-}
      - STACKARR_INDEXARR_ENABLED=${STACKARR_INDEXARR_ENABLED:-false}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    volumes:
      - mariadbdata:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-stackarr}
      - MARIADB_USER=${MARIADB_USER:-stackarr}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-stackarr}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-stackarr}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped


volumes:
  stackarr-config:
  stackarr-transcode:
  mariadbdata:
