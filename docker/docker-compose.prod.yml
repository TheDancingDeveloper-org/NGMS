# Example production compose. Adjust paths, credentials, and timezone for your environment.
# See docs/DEPLOYMENT.md for full deployment documentation.

services:
  stackarr:
    image: ghcr.io/ausagentsmith-org/stackarr:latest
    container_name: stackarr
    ports:
      - "9111:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - STACKARR_DATABASE_URL=postgresql://stackarr:stackarr@postgres:5432/stackarr
      - STACKARR_LOG_LEVEL=info
      - STACKARR_BIND=0.0.0.0
      - STACKARR_PORT=9111
      - STACKARR_TMDB_API_KEY=${STACKARR_TMDB_API_KEY}
      - STACKARR_INDEXARR_ENABLED=false
      - TZ=UTC
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    volumes:
      # Config + data
      - /path/to/config:/config
      - /path/to/data:/data

      # Media libraries (read-only — StackArr reads; download clients write)
      - /mnt/media/tv:/media/TV:ro
      - /mnt/media/movies:/media/Movies:ro

      # Transcode temp directory (writable — used by streaming server)
      - /path/to/transcode:/config/transcode

      # Download client output folders
      - /path/to/downloads/usenet:/downloads/usenet
      - /path/to/downloads/torrent:/downloads/torrent
    devices:
      - /dev/dri:/dev/dri  # Intel VAAPI hardware transcoding (optional)
    group_add:
      - "44"    # video
      - "992"   # render
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9111/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "stackarr"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4096m

  postgres:
    image: postgres:17-alpine
    container_name: stackarr-postgres
    volumes:
      - stackarr_pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=stackarr
      - POSTGRES_PASSWORD=stackarr
      - POSTGRES_DB=stackarr
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackarr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  stackarr_pgdata:
