# Stack 2 — Existing/Upgrade Test
# Ports: ngms=9212, postgres=5435, indexarr=8280
# Data volumes persist between runs (NOT nuked on restart).

services:
  ngms:
    image: ghcr.io/ausagentsmith/ngms:latest
    container_name: ngms-test-existing
    ports:
      - "9212:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      # Config (includes TOML)
      - existing-ngms-config:/config
      - ./config-existing.toml:/config/ngms.toml:ro

      # Download directories (docker volumes — isolated)
      - existing-dl-torrent-incomplete:/downloads/torrent/incomplete
      - existing-dl-torrent-complete:/downloads/torrent/complete
      - existing-dl-usenet-incomplete:/downloads/usenet/incomplete
      - existing-dl-usenet-complete:/downloads/usenet/complete

      # Test media output (writable — shared host dir with per-stack subdirs)
      - /tmp/ngms-test/existing/TV:/media/TV
      - /tmp/ngms-test/existing/Movies:/media/Movies

      # Existing media libraries (read-only — for library scan tests)
      - # /path/to/existing/tv:/media/TV1:ro
      - # /path/to/existing/movies:/media/Movies2:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9111/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ngms-test-existing-pg
    ports:
      - "5435:5432"
    volumes:
      - existing-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ngms
      - POSTGRES_PASSWORD=ngms
      - POSTGRES_DB=ngms
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngms"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  indexarr:
    image: ghcr.io/ausagentsmith/indexarr:latest
    container_name: ngms-test-existing-indexarr
    ports:
      - "8280:8080"
    environment:
      - INDEXARR_WORKERS=http_server,sync
      - INDEXARR_DB_BACKEND=sqlite
      - TZ=Australia/Sydney
    volumes:
      - existing-indexarr-data:/data
    restart: unless-stopped

volumes:
  existing-ngms-config:
  existing-pgdata:
  existing-dl-torrent-incomplete:
  existing-dl-torrent-complete:
  existing-dl-usenet-incomplete:
  existing-dl-usenet-complete:
  existing-indexarr-data:
