[workspace]
resolver = "3"
exclude = ["client/src-tauri"]
members = [
    "crates/stackarr-core",
    "crates/stackarr-media",
    "crates/stackarr-parser",
    "crates/stackarr-quality",
    "crates/stackarr-indexer",
    "crates/stackarr-download",
    "crates/stackarr-import",
    "crates/stackarr-scheduler",
    "crates/stackarr-metadata",
    "crates/stackarr-web",
    "crates/stackarr-notify",
    "crates/stackarr-migrate",
    "crates/stackarr-plex",
    "crates/stackarr-cardigann",
    "crates/stackarr-cardigann-parity",
    "crates/stackarr-stream",
    "crates/stackarr-postgres",
    "crates/stackarr-compat-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/TheDancingDeveloper-org/NGMS"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unused = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tokio-socks = "0.5"
tokio-rustls = "0.26"
tokio-test = "0.4"

# Web framework
axum = "0.8"
axum-extra = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header", "compression-gzip", "compression-br"] }
http = "1"

# Database
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "uuid", "derive", "macros", "migrate"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "cookies", "multipart", "form", "query", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_derive = "1"
serde_urlencoded = "0.7"
serde_with = "3"
toml = "1"
quick-xml = "0.39"
serde_yaml = "0.9"
scraper = "0.26"
bincode = "1"

# TLS
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
webpki-roots = "0.26"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry", "time"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Util
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
fancy-regex = "0.17"
pcre2 = "0.2"
async-trait = "0.1"
parking_lot = "0.12"
arc-swap = "1"
futures = "0.3"
bytes = "1"
url = "2"
hex = "0.4"
base64 = "0.22"
rand = "0.10"
itertools = "0.14"
dashmap = "6"
indexmap = "2"
lru = "0.16"
walkdir = "2"
tempfile = "3"
directories = "6"
home = "0.5"
gethostname = "1"
libc = "0.2"

# Encoding / hashing
crc32fast = "1"
sha2 = "0.10"
data-encoding = "2"
chardetng = "0.1"
encoding_rs = "0.8"
crypto-hash = "0.3"
flate2 = "1"

# Networking
network-interface = "2"
socket2 = "0.6"
httparse = "1"
bstr = "1"
librqbit-dualstack-sockets = "0.7"
librqbit-utp = "0.7"
nix = "0.31"

# Bencode / torrent
arrayvec = "0.7"
atoi = "2"
bitvec = "1"
byteorder = "1"
memchr = "2"
memmap2 = "0.9"
intervaltree = "0.2"

# Rate limiting / backoff
governor = "0.10"
leaky-bucket = "1.1"
backon = "1.6"

# Async utilities
async-stream = "0.3"
async-compression = "0.4"
async-backtrace = "0.2"

# Metrics
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Misc
size_format = "1"
rlimit = "0.10"
mime_guess = { version = "2", default-features = false }
urlencoding = "2"
parse_duration = "2"
pollster = "0.4"
signal-hook = "0.3"
aws-lc-rs = "1.16"
openssl = "0.10"
notify = "8"
assert_cfg = "0.1"
console-subscriber = "0.5"
criterion = "0.5"
windows = "0.62"
feed-rs = "2"
wiremock = "0.6"
http-body-util = "0.1"
rust-par2 = "=0.1.3"
yenc-simd = "=0.1.1"

# API docs
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# StackArr internal crates
stackarr-core = { path = "crates/stackarr-core" }
stackarr-media = { path = "crates/stackarr-media" }
stackarr-parser = { path = "crates/stackarr-parser" }
stackarr-quality = { path = "crates/stackarr-quality" }
stackarr-indexer = { path = "crates/stackarr-indexer" }
stackarr-download = { path = "crates/stackarr-download" }
stackarr-import = { path = "crates/stackarr-import" }
stackarr-scheduler = { path = "crates/stackarr-scheduler" }
stackarr-metadata = { path = "crates/stackarr-metadata" }
stackarr-web = { path = "crates/stackarr-web" }
stackarr-notify = { path = "crates/stackarr-notify" }
stackarr-migrate = { path = "crates/stackarr-migrate" }
stackarr-plex = { path = "crates/stackarr-plex" }
stackarr-cardigann = { path = "crates/stackarr-cardigann" }
stackarr-stream = { path = "crates/stackarr-stream" }
stackarr-postgres = { path = "crates/stackarr-postgres" }
stackarr-compat-core = { path = "crates/stackarr-compat-core" }

# SwarmForge 0.1.0, published by rustTorrent. Cargo aliases preserve the
# existing librtbit API names while the canonical crates.io package names make
# the dependency boundary explicit.
librtbit = { version = "=0.1.0", package = "swarmforge", default-features = false }
bencode = { version = "=0.1.0", package = "swarmforge-bencode", default-features = false }
buffers = { version = "=0.1.0", package = "swarmforge-buffers" }
clone_to_owned = { version = "=0.1.0", package = "swarmforge-clone-to-owned" }
librtbit-core = { version = "=0.1.0", package = "swarmforge-core", default-features = false }
dht = { version = "=0.1.0", package = "swarmforge-dht", default-features = false }
librtbit-lsd = { version = "=0.1.0", package = "swarmforge-lsd", default-features = false }
peer_binary_protocol = { version = "=0.1.0", package = "swarmforge-peer-protocol", default-features = false }
sha1w = { version = "=0.1.0", package = "swarmforge-sha1-wrapper", default-features = false }
tracker_comms = { version = "=0.1.0", package = "swarmforge-tracker-comms", default-features = false }
librtbit-upnp = { version = "=0.1.0", package = "swarmforge-upnp" }
upnp-serve = { version = "=0.1.0", package = "swarmforge-upnp-serve", default-features = false }

# Published Usenet engine crates. A clean checkout requires only crates.io.
nzb-web = "=0.4.21"
nzb-core = "=0.2.17"
nzb-nntp = "=0.2.23"
nzb-decode = "=0.1.3"
nzb-postproc = "=0.2.7"
nzb-news = "=0.1.13"
nzb-dispatch = "=0.2.7"

# Published NZBDav engine crates.
nzbdav-core = { version = "=0.5.7", default-features = false }
nzbdav-dav = "=0.5.7"
nzbdav-stream = "=0.5.7"
nzbdav-rar = "=0.5.7"
nzbdav-pipeline = "=0.5.7"

[package]
name = "stackarr"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ui"]
ui = []
managed-postgres = ["dep:stackarr-postgres"]
embed-postgres = ["stackarr-postgres/embed", "managed-postgres"]
embed-ui = ["stackarr-web/embed-ui"]

[dependencies]
stackarr-core = { workspace = true }
stackarr-web = { workspace = true }
stackarr-scheduler = { workspace = true }
stackarr-download = { workspace = true }
stackarr-indexer = { workspace = true }
stackarr-metadata = { workspace = true }
stackarr-migrate = { workspace = true }
stackarr-cardigann = { workspace = true }
stackarr-stream = { workspace = true }
librtbit = { workspace = true }
nzb-web = { workspace = true }
nzbdav-core = { workspace = true }
nzbdav-stream = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
sqlx = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
network-interface = { workspace = true }
librtbit-upnp = { workspace = true }
serde = { workspace = true }
rustls = { workspace = true }
stackarr-postgres = { workspace = true, optional = true }

[dev-dependencies]
# Select the otherwise optional twelfth SwarmForge crate so the lockfile and
# CI boundary test validate the complete published family.
upnp-serve = { workspace = true }

[profile.release]
