name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ngms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build embedded web assets
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
          npm --prefix client ci --no-audit --no-fund
          npm --prefix client run build
      - name: Verify public dependency boundary
        run: python3 scripts/check_dependency_sources.py
      - name: Verify workspace documentation
        run: python3 scripts/check_workspace_docs.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: stackarr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # The TestDb harness creates and drops a database per test, so this
      # account needs server-wide CREATE/DROP. root is scoped to the throwaway
      # service container and never leaves the job.
      TEST_DATABASE_URL: mysql://root:stackarr@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build embedded web assets
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
          npm --prefix client ci --no-audit --no-fund
          npm --prefix client run build
      - run: cargo test --workspace --all-features --locked
      # The database-backed tests are #[ignore]d so they can be skipped on a
      # machine with no server. They are the only thing that proves the
      # MariaDB swap against a real server, so CI must opt into them
      # explicitly now that the service container above exists.
      - name: Database-backed tests
        run: cargo test --workspace --all-features --locked -- --ignored

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build embedded web assets
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
          npm --prefix client ci --no-audit --no-fund
          npm --prefix client run build
      - run: cargo build --workspace --all-features --locked

  ui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ui, client]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - working-directory: ${{ matrix.project }}
        run: npm ci --no-audit --no-fund
      - working-directory: ${{ matrix.project }}
        run: npm run build

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci --no-audit --no-fund
      - working-directory: ui
        run: npx playwright install --with-deps chromium
      - working-directory: ui
        run: npm run test:e2e

  container:
    if: github.event_name == 'push'
    needs: [lint, test, build, ui, ui-e2e]
    runs-on: [self-hosted, node-b, linux, x64, publish, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/thedancingdeveloper-org/ngms:latest
            ghcr.io/thedancingdeveloper-org/ngms:sha-${{ github.sha }}
          cache-from: type=gha
          # The first canonical push uploaded the image successfully, then
          # wedged for more than 20 minutes exporting its optional GHA cache.
          # Keep cache reads, but do not let cache publication hold the image
          # delivery gate open indefinitely on the self-hosted publisher.
