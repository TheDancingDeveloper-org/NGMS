services:
  prowlarr-parity:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr-parity
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      - prowlarr-parity-config:/config
    ports:
      - "9797:9696"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr-parity
    environment:
      - LOG_LEVEL=info
    ports:
      - "8192:8191"
    restart: "no"

volumes:
  prowlarr-parity-config:
