name: Feature proposal
description: Propose in-scope StackArr behavior.
title: "feature: "
labels: ["type:task"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only a preferred implementation.
    validations:
      required: true
  - type: dropdown
    id: spec
    attributes:
      label: Governing source
      options: [OpenAPI, arr behavioral tests, TRaSH Guides, Internal StackArr contract]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Objective acceptance criteria
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This does not add features to a frozen or deferred subsystem.
          required: true
