# Stack 1 — Fresh Install Test
# Ports: stackarr=9211, mariadb=3309, indexarr=8180
# All data volumes are ephemeral (nuked each run).

services:
  stackarr:
    image: ghcr.io/thedancingdeveloper-org/ngms:latest
    container_name: stackarr-test-fresh
    ports:
      - "9211:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      # Config (includes TOML)
      - fresh-stackarr-config:/config
      - ./config-fresh.toml:/config/stackarr.toml:ro

      # Download directories (docker volumes — isolated)
      - fresh-dl-torrent-incomplete:/downloads/torrent/incomplete
      - fresh-dl-torrent-complete:/downloads/torrent/complete
      - fresh-dl-usenet-incomplete:/downloads/usenet/incomplete
      - fresh-dl-usenet-complete:/downloads/usenet/complete

      # Test media output (writable — shared host dir with per-stack subdirs)
      - /mnt/4tnvme/docker/volumes/stackrr_test_media/fresh/TV:/media/TV
      - /mnt/4tnvme/docker/volumes/stackrr_test_media/fresh/Movies:/media/Movies

      # Existing media libraries (read-only — for library scan tests)
      - /mnt/data2/TV1:/media/TV1:ro
      - /mnt/data1/movies2:/media/Movies2:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9111/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: stackarr-test-fresh-pg
    ports:
      - "3309:3306"
    volumes:
      - fresh-mariadbdata:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=stackarr
      - MARIADB_USER=stackarr
      - MARIADB_PASSWORD=stackarr
      - MARIADB_DATABASE=stackarr
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  indexarr:
    image: ghcr.io/thedancingdeveloper-org/indexarr-rs:latest
    container_name: stackarr-test-fresh-indexarr
    ports:
      - "8180:8080"
    environment:
      - INDEXARR_WORKERS=http_server,sync
      - INDEXARR_DB_BACKEND=sqlite
      - TZ=Australia/Sydney
    volumes:
      - fresh-indexarr-data:/data
    restart: unless-stopped

volumes:
  fresh-stackarr-config:
  fresh-mariadbdata:
  fresh-dl-torrent-incomplete:
  fresh-dl-torrent-complete:
  fresh-dl-usenet-incomplete:
  fresh-dl-usenet-complete:
  fresh-indexarr-data:
