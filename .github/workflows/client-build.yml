name: Build Client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
  pull_request:
    paths:
      - 'client/**'
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Browser build (static web app)
  build-web:
    runs-on: [self-hosted, node-b]
    name: Build Web Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web client
        run: |
          cd client
          npm ci
          npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackarr-player-web
          path: client/dist/
          retention-days: 30

  # Windows desktop build via Tauri
  build-windows:
    runs-on: windows-latest
    name: Build Windows Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-tauri-windows
          workspaces: client/src-tauri

      - name: Install frontend dependencies
        run: |
          cd client
          npm ci

      - name: Build Tauri app
        run: |
          cd client
          npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: stackarr-player-windows
          path: |
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  # Android build via Tauri
  build-android:
    runs-on: ubuntu-latest
    name: Build Android Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-tauri-android
          workspaces: client/src-tauri

      - name: Install frontend dependencies
        run: |
          cd client
          npm ci

      - name: Initialize Tauri Android
        run: |
          cd client
          npx tauri android init

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore

      - name: Build Android APK
        run: |
          cd client
          npx tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Sign APK with release keystore
        run: |
          UNSIGNED=$(find client/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          # Align the APK
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)/zipalign" -v -p 4 \
            "$UNSIGNED" "${{ runner.temp }}/aligned.apk"
          # Sign with apksigner
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)/apksigner" sign \
            --ks ${{ runner.temp }}/release.keystore \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out "${{ runner.temp }}/stackarr-player.apk" \
            "${{ runner.temp }}/aligned.apk"
          # Verify
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)/apksigner" verify \
            "${{ runner.temp }}/stackarr-player.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: stackarr-player-android
          path: ${{ runner.temp }}/stackarr-player.apk
          retention-days: 30

  # Create/update rolling "latest" release with all platform artifacts
  release:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [build-web, build-windows, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package web client
        run: |
          cd artifacts/stackarr-player-web
          zip -r ../../stackarr-player-web.zip .

      - name: Prepare release files
        run: |
          mkdir -p release
          cp stackarr-player-web.zip release/
          cp artifacts/stackarr-player-windows/*.msi release/ 2>/dev/null || true
          cp artifacts/stackarr-player-windows/*.exe release/ 2>/dev/null || true
          find artifacts/stackarr-player-android -name "*.apk" -exec cp {} release/ \; 2>/dev/null || true
          ls -la release/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: player-latest
          name: "StackArr Player (latest)"
          body: |
            Rolling release of the StackArr Player client, built from the latest `main` branch.

            **Downloads:**
            - **Windows** — `.msi` (installer) or `.exe` (NSIS setup)
            - **Android** — `.apk` (sideload)
            - **Web** — `.zip` (deploy as static site)

            Built from commit ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: release/*
          generate_release_notes: false
