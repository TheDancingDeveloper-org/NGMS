name: Bootstrap CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'crates/ngms-bootstrap/**'
      - 'docker/Dockerfile.bootstrap'
      - 'docker/root-bootstrap/**'
      - 'docker/docker-compose.bootstrap.yml'
      - '.github/workflows/bootstrap-deploy.yml'
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Compile Bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake gcc-12 g++-12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-bootstrap

      - name: Compile check
        run: cargo check -p ngms-bootstrap
        env:
          CC: gcc-12
          CXX: g++-12

  build-and-publish:
    runs-on: ubuntu-latest
    needs: check
    name: Build & Push Docker Image

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ausagentsmith-org/ngms-bootstrap
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.bootstrap
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-test:
    runs-on: ubuntu-latest
    needs: build-and-publish
    name: Docker Smoke Test

    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and smoke test
        run: |
          IMAGE="ghcr.io/ausagentsmith-org/ngms-bootstrap:${{ github.sha }}"
          echo "==> Pulling ${IMAGE}..."
          docker pull "${IMAGE}"
          echo "==> Checking binary exists..."
          docker run --rm --entrypoint /usr/local/bin/ngms-bootstrap "${IMAGE}" --help

  deploy:
    runs-on: [self-hosted, node-b]
    needs: [build-and-publish, container-test]
    if: github.ref == 'refs/heads/main'
    name: Deploy to Vultr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file
        run: |
          scp -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            docker/docker-compose.bootstrap.yml \
            root@100.92.4.57:/opt/ngms-bootstrap/docker-compose.bootstrap.yml

      - name: Deploy Bootstrap
        run: |
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            root@100.92.4.57 bash -s <<'REMOTE'
          set -e

          cd /opt/ngms-bootstrap
          mv -f docker-compose.bootstrap.yml docker-compose.yml

          echo "==> Pulling latest image..."
          docker pull ghcr.io/ausagentsmith-org/ngms-bootstrap:latest

          echo "==> Restarting services..."
          docker compose up -d --remove-orphans

          echo "==> Waiting for health check..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:7890/health > /dev/null 2>&1; then
              echo "Health check passed!"
              docker compose ps
              docker image prune -f
              exit 0
            fi
            echo "Attempt $i/12 - waiting 10s..."
            sleep 10
          done
          echo "Health check failed"
          docker compose logs --tail=30 bootstrap
          exit 1
          REMOTE
