when:
  - event: push
    branch: main
  - event: tag
  - event: manual
  - event: pull_request

steps:
  - name: fmt
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: check
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - cargo check --workspace

  - name: test
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - cargo test --workspace --lib

  - name: clippy
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - rustup component add clippy
      - cargo clippy --workspace -- -D warnings

  - name: ui-typecheck
    image: node:22-alpine
    commands:
      - cd ui && npm ci && npx tsc --noEmit -p tsconfig.app.json

  - name: playwright-mocked
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    commands:
      - cd ui
      - npm ci
      - npx playwright test --project=chromium
    when:
      - event: push
        branch: main

  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    when:
      - event: push
    settings:
      repo: repo.indexarr.net/indexarr/arz
      registry: repo.indexarr.net
      dockerfile: docker/Dockerfile
      username:
        from_secret: git_auth_token
      password:
        from_secret: git_auth_token
      tag: latest
      build_args_from_env:
        - PLUGIN_PASSWORD

  - name: build-and-push-release
    image: woodpeckerci/plugin-docker-buildx
    when:
      - event: tag
    settings:
      repo: repo.indexarr.net/indexarr/arz
      registry: repo.indexarr.net
      dockerfile: docker/Dockerfile
      username:
        from_secret: git_auth_token
      password:
        from_secret: git_auth_token
      tag: ["${CI_COMMIT_TAG}", latest]
      build_args:
        - RELEASE_OPTIMIZED=true
      build_args_from_env:
        - PLUGIN_PASSWORD

  - name: build-linux
    image: rust:1.88-bookworm
    when:
      - event: tag
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      CC_x86_64_unknown_linux_musl: musl-gcc
    commands:
      - apt-get update -qq && apt-get install -y -qq musl-tools cmake perl
      - rustup target add x86_64-unknown-linux-musl
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - python3 -c "c=open('Cargo.toml').read();c=c.replace('[profile.release]','native-tls = { version = \"0.2\", features = [\"vendored\"] }\nopenssl = { version = \"0.10\", features = [\"vendored\"] }\n\n[profile.release]');open('Cargo.toml','w').write(c)"
      - cargo build --release --target x86_64-unknown-linux-musl
      - cp target/x86_64-unknown-linux-musl/release/stackarr stackarr-linux-x86_64

  - name: build-windows
    image: rust:1.88-bookworm
    when:
      - event: tag
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
    commands:
      - apt-get update -qq && apt-get install -y -qq gcc-mingw-w64-x86-64 cmake perl
      - rustup target add x86_64-pc-windows-gnu
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - python3 -c "c=open('Cargo.toml').read();c=c.replace('[profile.release]','openssl = { version = \"0.10\", features = [\"vendored\"] }\n\n[profile.release]');open('Cargo.toml','w').write(c)"
      - cargo build --release --target x86_64-pc-windows-gnu
      - cp target/x86_64-pc-windows-gnu/release/stackarr.exe stackarr-windows-x86_64.exe

  - name: publish-artifacts
    image: alpine/curl
    when:
      - event: tag
    environment:
      FORGEJO_TOKEN:
        from_secret: git_auth_token
    commands:
      - |
        for FILE in stackarr-linux-x86_64 stackarr-windows-x86_64.exe; do
          curl -sf -X PUT \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$FILE" \
            "https://repo.indexarr.net/api/packages/indexarr/generic/stackarr/$CI_COMMIT_TAG/$FILE"
          echo "Published $FILE → repo.indexarr.net/indexarr/packages/generic/stackarr/$CI_COMMIT_TAG"
        done

  - name: deploy
    image: appleboy/drone-ssh
    when:
      - event: [push, tag]
        branch: main
        status: [success]
    settings:
      host: 100.92.54.45
      username: sprooty
      key:
        from_secret: deploy_ssh_key
      port: 22
      script:
        - cd /mnt/2tnvme/docker/volumes/stackarr
        - docker compose pull stackarr
        - docker compose up -d stackarr

  - name: push-github
    image: alpine/git
    when:
      - event: push
        branch: main
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
      FORGEJO_TOKEN:
        from_secret: git_auth_token
    commands:
      - git clone --bare "https://x-access-token:$FORGEJO_TOKEN@repo.indexarr.net/indexarr/Arz.git" /tmp/repo.git
      - cd /tmp/repo.git
      - git push --force "https://x-access-token:$GH_TOKEN@github.com/AusAgentSmith-org/StackArr.git" main:main
      - git push --force "https://x-access-token:$GH_TOKEN@github.com/AusAgentSmith-org/StackArr.git" --tags 2>/dev/null || true

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Successful\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Failed\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
