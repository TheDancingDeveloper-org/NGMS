# Production deployment for Node B (192.168.0.30)
# Deploy to: /data/stackarr/docker-compose.yml
#
# StackArr manages metadata and media files.
# Download clients handle the actual file writes.

services:
  stackarr:
    image: ghcr.io/ausagentsmith-org/stackarr:latest
    container_name: stackarr
    ports:
      - "9111:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - STACKARR_DATABASE_URL=postgresql://stackarr:stackarr@postgres:5432/stackarr
      - STACKARR_LOG_LEVEL=info
      - STACKARR_BIND=0.0.0.0
      - STACKARR_PORT=9111
      - STACKARR_TMDB_API_KEY=ecdcd59449b3a3a52c39d04aca6e7d54
      - STACKARR_INDEXARR_ENABLED=true
      - LIBVA_DRIVER_NAME=iHD
      - TZ=Australia/Sydney
    volumes:
      # Config + data
      - /mnt/2tnvme/docker/volumes/stackarr/config:/config
      - /mnt/2tnvme/docker/volumes/stackarr/data:/data

      # Media libraries
      - /mnt/data2/TV1:/media/TV1
      - /mnt/data1/TV2:/media/TV2
      - /mnt/data3/TV3:/media/TV3
      - /mnt/24T/movies/movies1:/media/Movies1
      - /mnt/data1/movies2:/media/Movies2
      - /mnt/data3/MoviesUHD:/media/MoviesUHD
      - /mnt/data1/Sports:/media/Sports

      # Transcode temp directory (writable — used by streaming server)
      - /mnt/2tnvme/docker/volumes/stackarr/transcode:/config/transcode

      # Download client output folders
      - /mnt/4tnvme/docker/volumes/rustnzb/downloads:/downloads/usenet
      - /mnt/4tnvme/docker/volumes/rusttorrent/downloads:/downloads/torrent
      - /mnt/4tnvme/docker/volumes/rusttorrent/completed:/downloads/torrent-complete
      - /mnt/4tnvme/docker/volumes/qbtorrent_data/seeding:/downloads/qbt-seeding
    devices:
      - /dev/dri:/dev/dri  # Intel VAAPI hardware transcoding
    group_add:
      - "44"    # video
      - "992"   # render
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9111/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4096m

  postgres:
    image: postgres:17-alpine
    container_name: stackarr-postgres
    volumes:
      - /mnt/2tnvme/docker/volumes/stackarr/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=stackarr
      - POSTGRES_PASSWORD=stackarr
      - POSTGRES_DB=stackarr
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackarr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Indexarr sidecar — set STACKARR_INDEXARR_ENABLED=true and use: docker compose --profile indexarr up -d
  indexarr:
    image: ghcr.io/ausagentsmith-org/indexarr:latest
    container_name: stackarr-indexarr
    environment:
      - INDEXARR_WORKERS=["http_server","sync"]
      - INDEXARR_DB_BACKEND=sqlite
      - TZ=Australia/Sydney
    volumes:
      - /mnt/2tnvme/docker/volumes/stackarr/indexarr:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
