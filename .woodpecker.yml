when:
  - event: push
    branch: main
  - event: manual

steps:
  - name: fmt
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: check
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - cargo check --workspace

  - name: test
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - cargo test --workspace --lib

  - name: clippy
    image: rust:1.88-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - rustup component add clippy
      - cargo clippy --workspace -- -D warnings

  - name: ui-typecheck
    image: node:22-alpine
    commands:
      - cd ui && npm ci && npx tsc --noEmit -p tsconfig.app.json

  - name: playwright-mocked
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    commands:
      - cd ui
      - npm ci
      - npx playwright test --project=chromium
    when:
      - event: push
        branch: main

  - name: build-and-push
    image: docker:27-cli
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - echo "$GIT_AUTH_TOKEN" | docker login repo.indexarr.net -u token --password-stdin
      - SHORT_SHA=$(echo $CI_COMMIT_SHA | head -c 8)
      - docker build --build-arg GIT_AUTH_TOKEN="$GIT_AUTH_TOKEN" -f docker/Dockerfile -t repo.indexarr.net/indexarr/stackarr:latest -t "repo.indexarr.net/indexarr/stackarr:$SHORT_SHA" .
      - docker push repo.indexarr.net/indexarr/stackarr:latest
      - docker push "repo.indexarr.net/indexarr/stackarr:$SHORT_SHA"

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      port: 22
      command_timeout: 5m
      script:
        - set -e
        - cd /mnt/2tnvme/docker/volumes/stackarr
        - docker compose pull stackarr
        - docker compose up -d --remove-orphans
        - |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:9111/health > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1
