# StackArr test config — Docker Compose E2E test environment
# All data is ephemeral (wiped each run via tmpfs/volumes).

[general]
instance_name = "StackArr-Test"
bind_addr = "0.0.0.0"
port = 9111
data_dir = "/config"
log_level = "debug"

[database]
url = "postgresql://stackarr:stackarr@postgres:5432/stackarr"
max_connections = 10

[auth]
method = "none"

[torrent]
enabled = true
download_dir = "/downloads/torrent/incomplete"
complete_dir = "/downloads/torrent/complete"
listen_port = 6881
dht_enabled = true
peer_limit = 100
upload_limit_bps = 0
download_limit_bps = 0

[usenet]
enabled = true
incomplete_dir = "/downloads/usenet/incomplete"
complete_dir = "/downloads/usenet/complete"
max_active_downloads = 3

[[usenet.servers]]
name = "Frugal-AU"
host = "aunews.frugalusenet.com"
port = 563
ssl = true
username = "example-user"
password = "example-password"
connections = 4
priority = 0

[indexarr]
enabled = true
url = "http://indexarr:8080"
api_key = ""
mode = "peer"

[streaming]
enabled = false

[bootstrap]
enabled = false

[naming.series]
rename = true
standard = "{Series Title} - S{season:00}E{episode:00} - {Episode Title} [{Quality Title}]"
season_folder = "Season {season:00}"

[naming.movie]
rename = true
standard = "{Movie Title} ({Release Year}) [{Quality Title}]"
folder = "{Movie Title} ({Release Year})"
