name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, node-b]
    name: Compile & Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake gcc-12 g++-12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-stackarr

      - name: Compile check
        run: cargo check --workspace
        env:
          CC: gcc-12
          CXX: g++-12

      - name: Start test database
        run: |
          docker compose -f docker/docker-compose.dev.yml up -d
          for i in $(seq 1 15); do
            if docker compose -f docker/docker-compose.dev.yml exec -T postgres pg_isready -U stackarr > /dev/null 2>&1; then
              echo "Postgres ready"
              break
            fi
            echo "Waiting for Postgres ($i/15)..."
            sleep 2
          done

      - name: Run tests
        run: cargo test --workspace --lib
        env:
          CC: gcc-12
          CXX: g++-12
          TEST_DATABASE_URL: "postgresql://stackarr:stackarr@localhost:5433/postgres"

      - name: Stop test database
        if: always()
        run: docker compose -f docker/docker-compose.dev.yml down -v

      - name: UI type check
        run: |
          cd ui
          npm ci
          npx tsc --noEmit -p tsconfig.app.json

  build-and-publish:
    runs-on: [self-hosted, node-b]
    needs: check
    if: github.event_name != 'pull_request'
    name: Build & Push Docker Image

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ausagentsmith-org/stackarr
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-test:
    runs-on: [self-hosted, node-b]
    needs: build-and-publish
    name: Docker Smoke Test

    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and smoke test
        run: |
          IMAGE="ghcr.io/ausagentsmith-org/stackarr:${{ github.sha }}"
          echo "==> Pulling ${IMAGE}..."
          docker pull "${IMAGE}"
          echo "==> Checking binary exists..."
          docker run --rm --entrypoint /usr/local/bin/stackarr "${IMAGE}" --help

  deploy:
    runs-on: [self-hosted, node-b]
    needs: [build-and-publish, container-test]
    if: github.ref == 'refs/heads/main'
    name: Deploy to Node B

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy StackArr
        run: |
          set -e

          echo "==> Pulling latest image..."
          docker pull ghcr.io/ausagentsmith-org/stackarr:latest

          echo "==> Deploying compose file..."
          mkdir -p /mnt/2tnvme/docker/volumes/stackarr
          cp docker/docker-compose.prod.yml /mnt/2tnvme/docker/volumes/stackarr/docker-compose.yml

          echo "==> Restarting services..."
          cd /mnt/2tnvme/docker/volumes/stackarr
          docker compose up -d --remove-orphans

          echo "==> Waiting for health check..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:9111/health > /dev/null 2>&1; then
              echo "Health check passed!"
              docker compose ps
              docker image prune -f
              exit 0
            fi
            echo "Attempt $i/12 - waiting 10s..."
            sleep 10
          done
          echo "Health check failed"
          docker compose logs --tail=30 stackarr
          exit 1
