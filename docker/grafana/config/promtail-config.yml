server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape all Docker container logs via the Docker socket
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use container name as the primary label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Capture compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Capture compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Drop containers we don't care about (e.g., promtail itself)
      - source_labels: ['container']
        regex: 'promtail'
        action: drop
    pipeline_stages:
      # Parse StackArr structured tracing output:
      # 2026-03-31T12:00:00.000000Z  INFO target: message key=value
      - regex:
          expression: '^(?P<timestamp>\S+)\s+(?P<level>\w+)\s+(?P<target>[^:]+):\s+(?P<message>.*)$'
      - labels:
          level:
          target:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
