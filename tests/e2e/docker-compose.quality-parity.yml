# Stack 4 — Quality Parity Test
# Ports: stackarr=9214, mariadb=3311
# Compares release scoring between StackArr and live Sonarr/Radarr.
# All data volumes are ephemeral (nuked each run).

services:
  stackarr:
    image: ${STACKARR_IMAGE:-ghcr.io/thedancingdeveloper-org/ngms:latest}
    container_name: stackarr-test-quality
    ports:
      - "9214:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      # Config (includes TOML)
      - quality-stackarr-config:/config
      - ./config-quality-parity.toml:/config/stackarr.toml:ro

      # Download directories (docker volumes — isolated)
      - quality-dl-torrent-incomplete:/downloads/torrent/incomplete
      - quality-dl-torrent-complete:/downloads/torrent/complete
      - quality-dl-usenet-incomplete:/downloads/usenet/incomplete
      - quality-dl-usenet-complete:/downloads/usenet/complete

      # Media dirs (writable but unused for this test)
      # On Node B use real paths; locally use MEDIA_BASE env or /tmp fallback
      - ${MEDIA_BASE:-/tmp/stackarr-quality-test}/TV:/media/TV
      - ${MEDIA_BASE:-/tmp/stackarr-quality-test}/Movies:/media/Movies
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: stackarr-test-quality-pg
    ports:
      - "5437:5432"
    volumes:
      - quality-mariadbdata:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=stackarr
      - MARIADB_USER=stackarr
      - MARIADB_PASSWORD=stackarr
      - MARIADB_DATABASE=stackarr
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  quality-stackarr-config:
  quality-mariadbdata:
  quality-dl-torrent-incomplete:
  quality-dl-torrent-complete:
  quality-dl-usenet-incomplete:
  quality-dl-usenet-complete:
