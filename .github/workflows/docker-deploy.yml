name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Compile & Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake gcc-12 g++-12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ngms

      - name: Compile check
        run: cargo check --workspace
        env:
          CC: gcc-12
          CXX: g++-12

      - name: Run tests
        run: cargo test --workspace --lib
        env:
          CC: gcc-12
          CXX: g++-12

      - name: UI type check
        run: |
          cd ui
          npm ci
          npx tsc --noEmit -p tsconfig.app.json

      - name: Client type check
        run: |
          cd client
          npm ci
          npx tsc --noEmit -p tsconfig.app.json

  build-and-publish:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    name: Build & Push Docker Image

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ausagentsmith-org/ngms
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-test:
    runs-on: ubuntu-latest
    needs: build-and-publish
    name: Docker Smoke Test

    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and smoke test
        run: |
          IMAGE="ghcr.io/ausagentsmith-org/ngms:${{ github.sha }}"
          echo "==> Pulling ${IMAGE}..."
          docker pull "${IMAGE}"
          echo "==> Checking binary exists..."
          docker run --rm --entrypoint /usr/local/bin/ngms "${IMAGE}" --help

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-publish, container-test]
    if: github.ref == 'refs/heads/main'
    name: Deploy

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client > /dev/null
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy NGMS
        env:
          DEPLOY_DIR: /opt/ngms
        run: |
          set -e
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 deploy_user@YOUR_SERVER_IP"

          echo "==> Pulling latest image..."
          docker pull ghcr.io/ausagentsmith-org/ngms:latest

          echo "==> Deploying compose file..."
          ${SSH} "mkdir -p ${DEPLOY_DIR}"
          cat docker/docker-compose.prod.yml | ${SSH} "cat > ${DEPLOY_DIR}/docker-compose.yml"

          echo "==> Restarting services..."
          ${SSH} "cd ${DEPLOY_DIR} && docker compose up -d --remove-orphans"

          echo "==> Waiting for health check..."
          for i in $(seq 1 12); do
            if ${SSH} "curl -sf http://localhost:9111/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              ${SSH} "cd ${DEPLOY_DIR} && docker compose ps && docker image prune -f"
              exit 0
            fi
            echo "Attempt $i/12 - waiting 10s..."
            sleep 10
          done
          echo "Health check failed"
          ${SSH} "cd ${DEPLOY_DIR} && docker compose logs --tail=30 ngms"
          exit 1
