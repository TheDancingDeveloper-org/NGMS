# Stack 2 — Existing/Upgrade Test
# Ports: stackarr=9212, mariadb=3308, indexarr=8280
# Data volumes persist between runs (NOT nuked on restart).

services:
  stackarr:
    image: ghcr.io/thedancingdeveloper-org/ngms:latest
    container_name: stackarr-test-existing
    ports:
      - "9212:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      # Config (includes TOML)
      - existing-stackarr-config:/config
      - ./config-existing.toml:/config/stackarr.toml:ro

      # Download directories (docker volumes — isolated)
      - existing-dl-torrent-incomplete:/downloads/torrent/incomplete
      - existing-dl-torrent-complete:/downloads/torrent/complete
      - existing-dl-usenet-incomplete:/downloads/usenet/incomplete
      - existing-dl-usenet-complete:/downloads/usenet/complete

      # Test media output (writable — shared host dir with per-stack subdirs)
      - /mnt/4tnvme/docker/volumes/stackrr_test_media/existing/TV:/media/TV
      - /mnt/4tnvme/docker/volumes/stackrr_test_media/existing/Movies:/media/Movies

      # Existing media libraries (read-only — for library scan tests)
      - /mnt/data2/TV1:/media/TV1:ro
      - /mnt/data1/movies2:/media/Movies2:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9111/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: stackarr-test-existing-pg
    ports:
      - "3308:3306"
    volumes:
      - existing-mariadbdata:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=stackarr
      - MARIADB_USER=stackarr
      - MARIADB_PASSWORD=stackarr
      - MARIADB_DATABASE=stackarr
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  indexarr:
    image: ghcr.io/thedancingdeveloper-org/indexarr-rs:latest
    container_name: stackarr-test-existing-indexarr
    ports:
      - "8280:8080"
    environment:
      - INDEXARR_WORKERS=http_server,sync
      - INDEXARR_DB_BACKEND=sqlite
      - TZ=Australia/Sydney
    volumes:
      - existing-indexarr-data:/data
    restart: unless-stopped

volumes:
  existing-stackarr-config:
  existing-mariadbdata:
  existing-dl-torrent-incomplete:
  existing-dl-torrent-complete:
  existing-dl-usenet-incomplete:
  existing-dl-usenet-complete:
  existing-indexarr-data:
