services:
  stackarr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8989:8989"
    volumes:
      - stackarr-config:/config
      - /media/tv:/media/tv
      - /media/movies:/media/movies
      - /downloads:/downloads
    environment:
      - STACKARR_DATABASE_URL=postgresql://stackarr:stackarr@postgres:5432/stackarr
      - STACKARR_LOG_LEVEL=info
      - STACKARR_BIND=0.0.0.0
      - STACKARR_PORT=8989
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=stackarr
      - POSTGRES_PASSWORD=stackarr
      - POSTGRES_DB=stackarr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackarr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Indexarr sidecar
  indexarr:
    image: indexarr:latest
    environment:
      - INDEXARR_WORKERS=http_server,sync
      - INDEXARR_DB_BACKEND=sqlite
    ports:
      - "8080:8080"
    profiles:
      - indexarr
    restart: unless-stopped

volumes:
  stackarr-config:
  pgdata:
