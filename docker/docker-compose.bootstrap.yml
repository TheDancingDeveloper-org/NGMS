# Bootstrap discovery node deployment
# Deploy to Hetzner or Vultr (needs public internet access)
#
# Sits behind Caddy reverse proxy:
#   bootstrap.indexarr.net -> localhost:7890

services:
  bootstrap:
    image: repo.indexarr.net/indexarr/stackarr-bootstrap:latest
    container_name: stackarr-bootstrap
    ports:
      - "7890:7890"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      - ./bootstrap-config:/config
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7890/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
