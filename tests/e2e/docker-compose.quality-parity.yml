# Stack 4 — Quality Parity Test
# Ports: ngms=9214, postgres=5437
# Compares release scoring between NGMS and live Sonarr/Radarr.
# All data volumes are ephemeral (nuked each run).

services:
  ngms:
    image: ${NGMS_IMAGE:-ghcr.io/ausagentsmith/ngms:latest}
    container_name: ngms-test-quality
    ports:
      - "9214:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      # Config (includes TOML)
      - quality-ngms-config:/config
      - ./config-quality-parity.toml:/config/ngms.toml:ro

      # Download directories (docker volumes — isolated)
      - quality-dl-torrent-incomplete:/downloads/torrent/incomplete
      - quality-dl-torrent-complete:/downloads/torrent/complete
      - quality-dl-usenet-incomplete:/downloads/usenet/incomplete
      - quality-dl-usenet-complete:/downloads/usenet/complete

      # Media dirs (writable but unused for this test)
      # On production server use real paths; locally use MEDIA_BASE env or /tmp fallback
      - ${MEDIA_BASE:-/tmp/ngms-quality-test}/TV:/media/TV
      - ${MEDIA_BASE:-/tmp/ngms-quality-test}/Movies:/media/Movies
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ngms-test-quality-pg
    ports:
      - "5437:5432"
    volumes:
      - quality-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ngms
      - POSTGRES_PASSWORD=ngms
      - POSTGRES_DB=ngms
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngms"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  quality-ngms-config:
  quality-pgdata:
  quality-dl-torrent-incomplete:
  quality-dl-torrent-complete:
  quality-dl-usenet-incomplete:
  quality-dl-usenet-complete:
