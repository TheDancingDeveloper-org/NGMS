# Stack 3 — Import Test
# Ports: stackarr=9213, mariadb=3310
# Tests Sonarr/Radarr/Prowlarr DB import + SABnzbd config import.
# All data volumes are ephemeral (nuked each run).

services:
  stackarr:
    image: ghcr.io/thedancingdeveloper-org/ngms:latest
    container_name: stackarr-test-import
    ports:
      - "9213:9111"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Sydney
    volumes:
      # Config (includes TOML)
      - import-stackarr-config:/config
      - ./config-import.toml:/config/stackarr.toml:ro

      # Download directories (docker volumes — isolated)
      - import-dl-torrent-incomplete:/downloads/torrent/incomplete
      - import-dl-torrent-complete:/downloads/torrent/complete
      - import-dl-usenet-incomplete:/downloads/usenet/incomplete
      - import-dl-usenet-complete:/downloads/usenet/complete

      # Test media output (writable)
      - /mnt/4tnvme/docker/volumes/stackrr_test_media/import/TV:/media/TV
      - /mnt/4tnvme/docker/volumes/stackrr_test_media/import/Movies:/media/Movies

      # Existing media libraries (read-only)
      - /mnt/data2/TV1:/media/TV1:ro
      - /mnt/data1/movies2:/media/Movies2:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9111/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: stackarr-test-import-pg
    ports:
      - "3310:3306"
    volumes:
      - import-mariadbdata:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=stackarr
      - MARIADB_USER=stackarr
      - MARIADB_PASSWORD=stackarr
      - MARIADB_DATABASE=stackarr
      - TZ=Australia/Sydney
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  import-stackarr-config:
  import-mariadbdata:
  import-dl-torrent-incomplete:
  import-dl-torrent-complete:
  import-dl-usenet-incomplete:
  import-dl-usenet-complete:
